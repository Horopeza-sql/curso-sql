site_name: Programa de Análisis de Datos desde Cero
site_description: "Programa completo de Análisis de Datos. Fase 1: SQL aplicado al análisis de datos."
site_author: Horopeza-sql
site_url: https://Horopeza-sql.github.io/curso-sql/

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2

nav:
  - Programa:
    - Inicio: index.md
    - Roadmap del Programa: roadmap.md
  - "Fase 1 · SQL":
    - fase-1/index.md
    - Introducción y Entorno:
      - 01-introduccion/index.md
      - ¿Qué es una base de datos?: 01-introduccion/que-es-base-de-datos.md
      - ¿Qué es SQL?: 01-introduccion/que-es-sql.md
      - ¿Por qué aprender SQL?: 01-introduccion/por-que-aprender-sql.md
      - Alcance: 01-introduccion/alcance.md
      - Trabajos: 01-introduccion/trabajos.md
      - Instalación de MySQL: 01-introduccion/instalacion-mysql.md
    - Fundamentos de BD: 02-fundamentos-bd/index.md
    - Consultas Esenciales: 03-consultas/index.md
    - Análisis y Agregaciones: 04-analisis/index.md
    - Relaciones y Modelado: 05-relaciones/index.md
    - Diseño y Objetos: 06-diseno-objetos/index.md
    - SQL Avanzado: 07-sql-avanzado/index.md
    - Calidad y Trabajo Profesional: 08-calidad/index.md
    - Administración Básica: 09-administracion/index.md
    - Proyecto Final: 10-proyecto/index.md
    - Referencia Rápida: 11-referencia/index.md