site_name: Curso SQL
site_description: Curso completo de SQL en español, desde cero hasta administración.
site_author: Horopeza-sql
site_url: https://Horopeza-sql.github.io/curso-sql/

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - 0. Introducción: 00-introduccion.md
  - 1. Básicos: 01-basicos.md
  - 2. Intermedios: 02-intermedios.md
  - 3. Avanzados: 03-avanzados.md
  - 4. Objetos de BD: 04-objetos-bd.md
  - 5. Administración: 05-administracion.md
  - 6. Referencia Rápida: 06-referencia-rapida.md